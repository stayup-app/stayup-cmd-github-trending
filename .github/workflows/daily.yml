name: Daily GitHub Trending

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # permet de lancer manuellement depuis GitHub

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trending fetch
        env:
          STAYUP_API_URL: ${{ secrets.STAYUP_API_URL }}
          STAYUP_API_KEY: ${{ secrets.STAYUP_API_KEY }}
        run: python fetch_trending.py
