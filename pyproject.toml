[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=fetch_trending --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["fetch_trending"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.black]
line-length = 120
target-version = ["py313"]
